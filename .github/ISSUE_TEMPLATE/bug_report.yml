name: Bug report
description: Report reproducible incorrect behavior
title: "fix: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thank you for taking the time to report a problem. Do not include credentials, proxy URLs, prompts, or session content.
  - type: input
    id: pi-version
    attributes:
      label: Pi version
      placeholder: "0.84.2"
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      placeholder: "v0.1.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe the observed and expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start pi with ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system, terminal, and Node.js version.
    validations:
      required: true
